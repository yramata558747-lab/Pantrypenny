name: pantrypenny
description: "PantryPenny — Shop smart. Save more. Waste less."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # --- Photo-based item recognition (Lens-style) ---
  image_picker: ^1.1.2
  google_mlkit_image_labeling: ^0.13.0
  google_mlkit_text_recognition: ^0.14.0
  permission_handler: ^11.3.1

  # --- Login (local, on-device account) ---
  crypto: ^3.0.3

  # --- State management ---
  provider: ^6.1.2

  # --- Local storage (offline-first) ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # --- Cloud / Firebase ---
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.1.0
  cloudinary_public: ^0.23.1
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true